name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project DSMLivePhoto.xcodeproj -scheme DSMLivePhoto \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/DSMLivePhoto.app Payload/
          zip -r DSMLivePhoto.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DSMLivePhoto-ipa
          path: DSMLivePhoto.ipa
